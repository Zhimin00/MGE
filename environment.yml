name: pi3

channels:
  - conda-forge

dependencies:
  - python=3.10.20
  - pip
  - pip:
      # Core model and image processing
      - torch==2.5.1
      - torchvision==0.20.1
      - numpy==1.26.4
      - pillow==11.3.0
      - opencv-python==4.11.0.86
      - einops==0.8.2
      - safetensors==0.7.0
      - huggingface-hub==1.20.1
      - plyfile==1.1.3

      # Evaluation and configuration
      - hydra-core==1.3.3
      - omegaconf==2.3.1
      - scipy==1.15.3
      - pandas==2.3.3
      - matplotlib==3.10.9
      - imageio==2.37.3
      - open3d==0.19.0
      - evo==1.37.0
      - tqdm==4.67.3

      # Interactive demo
      - gradio==5.17.1
      - trimesh==4.10.0
